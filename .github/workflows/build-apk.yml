name: Build & Publish TaibahNet-Cards Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release: V1+V2+V3 signed via Keystore secrets or auto keytool | debug: assembleDebug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript Lint & Production Web Build
        run: |
          npm run lint
          npm run build

      - name: Initialize & Sync Capacitor Android Project with Native Plugins
        run: |
          test -f capacitor.config.json
          npm install --no-save --no-audit --no-fund \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @capacitor/filesystem@7 \
            @capacitor/share@7 \
            @capacitor-community/contacts@7 \
            @capacitor/push-notifications@7 \
            @capacitor/haptics@7 \
            @capgo/capacitor-native-biometric@7 \
            @capacitor/assets@3
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          mkdir -p resources
          cp public/pwa-512x512.png resources/icon.png
          cp public/pwa-512x512.png resources/splash.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0F172A' --splashBackgroundColor '#0F172A' || true
          mkdir -p android/app/src/main/res/drawable
          cp public/pwa-512x512.png android/app/src/main/res/drawable/taibah_logo.png || true

      - name: Configure Android Permissions (Contacts, BiometricPrompt & Notifications)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in \
            "android.permission.READ_CONTACTS" \
            "android.permission.USE_BIOMETRIC" \
            "android.permission.POST_NOTIFICATIONS"; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "0,/<application/{s|<application|<uses-permission android:name=\"$PERM\" />\n    <application|}" "$MANIFEST"
            fi
          done

      - name: Build & Sign Installable Android APK (Debug / Release V1+V2+V3)
        working-directory: android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          test -x "$APKSIGNER" || { echo "::error::apksigner not found in $BUILD_TOOLS_DIR"; exit 1; }
          test -x "$ZIPALIGN" || { echo "::error::zipalign not found in $BUILD_TOOLS_DIR"; exit 1; }

          rm -f ../TaibahNet-Cards.apk release.keystore

          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "=== Building Signed Android Debug APK ==="
            ./gradlew assembleDebug
            DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
            test -s "$DEBUG_APK" || { echo "::error::Debug APK not produced at $DEBUG_APK"; exit 1; }
            cp -f "$DEBUG_APK" ../TaibahNet-Cards.apk
            echo "SIGNING_STATUS=DEBUG_SIGNED" >> "$GITHUB_ENV"
          else
            echo "=== Building Signed Android Release APK ==="
            ./gradlew assembleRelease

            if [ -s "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              RAW_RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            elif [ -s "app/build/outputs/apk/release/app-release.apk" ]; then
              RAW_RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
            else
              echo "::error::Release APK output not found in app/build/outputs/apk/release/"
              ls -la app/build/outputs/apk/release/ || true
              exit 1
            fi

            ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
            rm -f "$ALIGNED_APK"
            "$ZIPALIGN" -f -p -v 4 "$RAW_RELEASE_APK" "$ALIGNED_APK"

            if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
              echo "Using repository Android Release Keystore secrets..."
              echo "$KEYSTORE_B64" | base64 -d > release.keystore
              SIGN_STORE_PASS="$KEYSTORE_PASS"
              SIGN_KEY_ALIAS="$KEY_ALIAS"
              SIGN_KEY_PASS="$KEY_PASS"
              echo "SIGNING_STATUS=RELEASE_SIGNED_ORIGINAL_KEYSTORE" >> "$GITHUB_ENV"
            else
              echo "Keystore secrets not configured; generating automatic RSA-2048 Release Keystore via keytool..."
              SIGN_STORE_PASS=$(openssl rand -hex 16)
              SIGN_KEY_PASS="$SIGN_STORE_PASS"
              SIGN_KEY_ALIAS="taibah-net-release"
              keytool -genkeypair -v \
                -keystore release.keystore \
                -storetype PKCS12 \
                -alias "$SIGN_KEY_ALIAS" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$SIGN_STORE_PASS" \
                -keypass "$SIGN_KEY_PASS" \
                -dname "CN=Taibah Net, OU=TAIBAH NET, O=Taibah Net Wireless, L=Yemen, C=YE"
              echo "SIGNING_STATUS=RELEASE_SIGNED_AUTO_KEYTOOL_V1_V2_V3" >> "$GITHUB_ENV"
            fi

            "$APKSIGNER" sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks release.keystore \
              --ks-pass "pass:$SIGN_STORE_PASS" \
              --ks-key-alias "$SIGN_KEY_ALIAS" \
              --key-pass "pass:$SIGN_KEY_PASS" \
              --out ../TaibahNet-Cards.apk \
              "$ALIGNED_APK"

            rm -f release.keystore "$ALIGNED_APK"
          fi

          test -s ../TaibahNet-Cards.apk || { echo "::error::Final TaibahNet-Cards.apk is missing or empty"; exit 1; }

          echo "=== Verifying APK Alignment (zipalign -c) ==="
          "$ZIPALIGN" -c -v 4 ../TaibahNet-Cards.apk

          echo "=== Verifying Official APK Signature (apksigner verify) ==="
          "$APKSIGNER" verify --verbose --print-certs ../TaibahNet-Cards.apk

          if [ -x "$AAPT2" ]; then
            echo "=== Verifying Android Package Metadata (aapt2) ==="
            "$AAPT2" dump badging ../TaibahNet-Cards.apk | head -n 5
          fi

          echo "=== APK SHA-256 & File Size ==="
          sha256sum ../TaibahNet-Cards.apk
          ls -lh ../TaibahNet-Cards.apk

      - name: Upload TaibahNet-Cards.apk Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaibahNet-Cards-APK
          path: TaibahNet-Cards.apk
          retention-days: 90

      - name: Publish Direct APK to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: كروت طيبة نت — TAIBAH NET (Android Release APK)
          body: |
            الإصدار النهائي الجاهز للتثبيت المباشر من تطبيق **كروت طيبة نت – TAIBAH NET**.
            - **applicationId:** `net.taibah.wireless`
            - **حالة التوقيع:** `${{ env.SIGNING_STATUS }}`
            - يدعم الدخول بالبصمة والوجه عبر **Android BiometricPrompt** والعمل أوفلاين (Offline-First)
            - يدعم مشاركة الفواتير والكشوفات (PDF عربي + صور HD) وجلب جهات الاتصال مباشرة من الهاتف
            - مزامنة لحظية مع Firebase Firestore
          files: TaibahNet-Cards.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
