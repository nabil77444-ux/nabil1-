name: Build & Publish TaibahNet-Cards Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release: V1+V2+V3 signed via Keystore secrets or persistent cached Keystore | debug: assembleDebug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript Lint, Production Web Build & Lightweight OTA Bundle (update.zip + version.json)
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_VERSION: 2.1.${{ github.run_number }}
          VITE_NATIVE_VERSION: "2.1.0"
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_NATIVE_VERSION: "2.1.0"
        run: |
          set -euo pipefail
          npm run lint
          npm run build
          rm -f update.zip version.json
          # Ultra-compressed UI-only OTA bundle (-9): excludes source maps, heavy OCR/PDF workers, and unused large launcher PNGs
          (cd dist && zip -r -9 -q ../update.zip . \
            -x "*.map" \
            -x "*tesseract*" \
            -x "*vendor-ocr*" \
            -x "*pdf.worker*" \
            -x "*vendor-pdf*" \
            -x "pwa-512x512.png" \
            -x "pwa-maskable-512x512.png" \
            -x "apple-touch-icon.png")
          test -s update.zip || { echo "::error::update.zip was not created"; exit 1; }
          python3 - <<'PYEOF'
          import json, os, datetime

          size_bytes = os.path.getsize("update.zip")
          size_mb = round(size_bytes / (1024 * 1024), 2)
          if size_bytes < 1024 * 1024:
              size_text = f"{max(1, round(size_bytes / 1024))} كيلوبايت"
          else:
              size_text = f"{size_bytes / (1024 * 1024):.1f} ميجابايت"

          run_num = int(os.environ["GITHUB_RUN_NUMBER"])
          repo = os.environ["GITHUB_REPOSITORY"]
          version = f"2.1.{run_num}"
          native_version = os.environ.get("APP_NATIVE_VERSION", "2.1.0")

          # Read structured Arabic release notes from release-notes.json (root)
          type_labels = {
              "add": "إضافة",
              "improve": "تحسين",
              "fix": "إصلاح",
              "security": "أمان",
              "remove": "إزالة",
          }
          release_title = "تحديث جديد لتطبيق كروت طيبة نت"
          release_summary = "تحسينات شاملة للأداء والمزامنة والأمان وتجربة الاستخدام."
          changes_list = []

          if os.path.exists("release-notes.json"):
              try:
                  with open("release-notes.json", "r", encoding="utf-8") as rf:
                      rn = json.load(rf)
                  if isinstance(rn, dict):
                      if isinstance(rn.get("title"), str) and rn["title"].strip():
                          release_title = rn["title"].strip()[:120]
                      if isinstance(rn.get("summary"), str) and rn["summary"].strip():
                          release_summary = rn["summary"].strip()[:240]
                      if isinstance(rn.get("changes"), list):
                          for item in rn["changes"][:15]:
                              if not isinstance(item, dict):
                                  continue
                              ctype = str(item.get("type", "improve")).strip().lower()
                              if ctype not in type_labels:
                                  ctype = "improve"
                              ctext = str(item.get("text", "")).strip()[:260]
                              if ctext:
                                  changes_list.append({"type": ctype, "text": ctext})
              except Exception as ex:
                  print(f"::warning::Failed to parse release-notes.json: {ex}")

          notes_lines = [release_summary]
          for ch in changes_list:
              notes_lines.append(f"• {type_labels.get(ch['type'], 'تحسين')}: {ch['text']}")
          combined_notes = "\n".join(notes_lines)[:600]

          # Write markdown changelog file for GitHub Release body
          md_lines = [f"### {release_title}", f"> {release_summary}", ""]
          for ch in changes_list:
              md_lines.append(f"- **{type_labels.get(ch['type'], 'تحسين')}:** {ch['text']}")
          with open(".release-notes-body.md", "w", encoding="utf-8") as mf:
              mf.write("\n".join(md_lines))

          # Ordered fastest-to-slowest OTA mirrors (CDN -> GitHub Raw -> GitHub Releases)
          jsdelivr_url = f"https://cdn.jsdelivr.net/gh/{repo}@ota-dist/update.zip?v={run_num}"
          raw_url = f"https://raw.githubusercontent.com/{repo}/ota-dist/update.zip?v={run_num}"
          release_url = f"https://github.com/{repo}/releases/latest/download/update.zip"
          bundle_mirrors = [jsdelivr_url, raw_url, release_url]

          manifest = {
              "version": version,
              "buildNumber": run_num,
              "nativeVersion": native_version,
              "minNativeVersion": native_version,
              "updateSizeBytes": size_bytes,
              "updateSizeText": size_text,
              "sizeMb": size_mb,
              "releaseTitle": release_title,
              "releaseSummary": release_summary,
              "changes": changes_list,
              "notes": combined_notes,
              "bundleUrl": jsdelivr_url,
              "otaUrl": jsdelivr_url,
              "bundleMirrors": bundle_mirrors,
              "apkUrl": f"https://github.com/{repo}/releases/latest/download/TaibahNet-Cards.apk",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print("=== Generated OTA Manifest (version.json) ===")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PYEOF
          ls -lh update.zip

      - name: Publish Lightweight OTA CDN Mirror (ota-dist branch — version.json & update.zip only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/ota-dist
          mkdir -p /tmp/ota-dist
          cp -f version.json /tmp/ota-dist/version.json
          cp -f update.zip /tmp/ota-dist/update.zip
          touch /tmp/ota-dist/.nojekyll
          git -C /tmp/ota-dist init -b ota-dist
          git -C /tmp/ota-dist config user.name "github-actions[bot]"
          git -C /tmp/ota-dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/ota-dist add version.json update.zip .nojekyll
          git -C /tmp/ota-dist commit -m "OTA CDN bundle v2.1.${{ github.run_number }} (build #${{ github.run_number }})"
          git -C /tmp/ota-dist push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ota-dist
          rm -rf /tmp/ota-dist
          echo "Published version.json & update.zip to ota-dist CDN mirror branch cleanly (main untouched)."

      - name: Initialize & Sync Capacitor Android Project with Native Plugins
        run: |
          set -euo pipefail
          test -f capacitor.config.json
          npm install --legacy-peer-deps --no-save --no-audit --no-fund \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @capacitor/push-notifications@7 \
            @capacitor/haptics@7 \
            @capacitor/assets@3
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

          # Integrate Native AndroidX BiometricPrompt & WorkManager OTA Update Notifier Plugins
          JAVA_PKG_DIR="android/app/src/main/java/net/taibah/wireless"
          mkdir -p "$JAVA_PKG_DIR"
          cp -f native-android/TaibahBiometricPlugin.java "$JAVA_PKG_DIR/TaibahBiometricPlugin.java"
          cp -f native-android/UpdateCheckWorker.java "$JAVA_PKG_DIR/UpdateCheckWorker.java"
          cp -f native-android/TaibahUpdateNotifierPlugin.java "$JAVA_PKG_DIR/TaibahUpdateNotifierPlugin.java"
          test -s "$JAVA_PKG_DIR/TaibahBiometricPlugin.java" || { echo "::error::TaibahBiometricPlugin.java copy failed"; exit 1; }
          test -s "$JAVA_PKG_DIR/UpdateCheckWorker.java" || { echo "::error::UpdateCheckWorker.java copy failed"; exit 1; }
          test -s "$JAVA_PKG_DIR/TaibahUpdateNotifierPlugin.java" || { echo "::error::TaibahUpdateNotifierPlugin.java copy failed"; exit 1; }

          # Register TaibahBiometricPlugin & TaibahUpdateNotifierPlugin BEFORE super.onCreate,
          # and disable Android 8+ WebView Autofill AFTER super.onCreate to eliminate keyboard freeze/lag
          python3 - <<'PYEOF'
          import os, re
          main_activity = "android/app/src/main/java/net/taibah/wireless/MainActivity.java"
          if not os.path.exists(main_activity):
              raise FileNotFoundError(f"MainActivity.java not found at {main_activity}")

          with open(main_activity, "r", encoding="utf-8") as f:
              src = f.read()

          if "import android.os.Bundle;" not in src:
              src = re.sub(
                  r'(package\s+net\.taibah\.wireless;\s*)',
                  '\\1\nimport android.os.Bundle;\n',
                  src,
                  count=1
              )

          plugins_to_register = [
              "TaibahBiometricPlugin.class",
              "TaibahUpdateNotifierPlugin.class",
          ]
          missing = [p for p in plugins_to_register if p not in src]
          if missing:
              reg_lines = "\n        ".join(f"registerPlugin({p});" for p in missing)
              if re.search(r'super\.onCreate\s*\(\s*savedInstanceState\s*\)\s*;', src):
                  src = re.sub(
                      r'(super\.onCreate\s*\(\s*savedInstanceState\s*\)\s*;)',
                      f'{reg_lines}\n        \\1',
                      src,
                      count=1
                  )
              else:
                  src = re.sub(
                      r'(public\s+class\s+MainActivity\s+extends\s+BridgeActivity\s*\{)',
                      f'\\1\n    @Override\n    public void onCreate(Bundle savedInstanceState) {{\n        {reg_lines}\n        super.onCreate(savedInstanceState);\n    }}\n',
                      src,
                      count=1
                  )

          autofill_guard = (
              "if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O "
              "&& getBridge() != null && getBridge().getWebView() != null) {\n"
              "            getBridge().getWebView().setImportantForAutofill("
              "android.view.View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS);\n"
              "        }"
          )
          if "setImportantForAutofill" not in src:
              src = re.sub(
                  r'(super\.onCreate\s*\(\s*savedInstanceState\s*\)\s*;)',
                  f'\\1\n        {autofill_guard}',
                  src,
                  count=1
              )

          with open(main_activity, "w", encoding="utf-8") as f:
              f.write(src)
          print("=== Verified MainActivity.java ===")
          print(src)
          PYEOF

          # Ensure androidx.biometric:biometric:1.1.0 & androidx.work:work-runtime:2.9.0 dependencies are declared
          python3 - <<'PYEOF'
          import re
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              txt = f.read()
          deps_to_add = [
              'implementation "androidx.biometric:biometric:1.1.0"',
              'implementation "androidx.work:work-runtime:2.9.0"',
          ]
          for dep in deps_to_add:
              artifact = dep.split('"')[1].rsplit(':', 1)[0]
              if artifact not in txt:
                  txt = re.sub(
                      r'(dependencies\s*\{)',
                      f'\\1\n    {dep}',
                      txt,
                      count=1
                  )
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(txt)
          print("Verified androidx.biometric & androidx.work:work-runtime:2.9.0 in android/app/build.gradle")
          PYEOF

      - name: Generate Full Circular Uncropped Android Adaptive Icon, Round Launcher & Splash
        run: |
          set -euo pipefail
          mkdir -p resources
          python3 - <<'PYEOF'
          import os, shutil
          try:
              from PIL import Image, ImageDraw
              src = Image.open("public/pwa-512x512.png").convert("RGBA")
              # Sample deep midnight navy from the official logo's top-left corner for seamless blending
              bg_sample = src.getpixel((4, 4))
              navy_rgb = (bg_sample[0], bg_sample[1], bg_sample[2])
              navy_rgba = (navy_rgb[0], navy_rgb[1], navy_rgb[2], 255)
              gold_rgba = (212, 175, 55, 255)

              def make_circular_medallion(diameter: int, logo_ratio: float = 0.78, ring_px: int = 12) -> Image.Image:
                  """Build a crisp anti-aliased full circular royal medallion with zero square clipping."""
                  scale = 2
                  D = diameter * scale
                  R = ring_px * scale
                  canvas = Image.new("RGBA", (D, D), (0, 0, 0, 0))

                  # 1. Outer circular disc filled with matching navy
                  disc = Image.new("RGBA", (D, D), navy_rgba)
                  logo_side = int(D * logo_ratio)
                  logo_resized = src.resize((logo_side, logo_side), Image.LANCZOS)
                  offset = (D - logo_side) // 2
                  disc.paste(logo_resized, (offset, offset), logo_resized)

                  # 2. Apply crisp circular alpha mask
                  mask = Image.new("L", (D, D), 0)
                  mdraw = ImageDraw.Draw(mask)
                  mdraw.ellipse((0, 0, D - 1, D - 1), fill=255)
                  canvas.paste(disc, (0, 0), mask)

                  # 3. Draw refined royal gold circular ring around the perimeter
                  if R > 0:
                      draw = ImageDraw.Draw(canvas)
                      draw.ellipse((R // 2, R // 2, D - 1 - R // 2, D - 1 - R // 2), outline=gold_rgba, width=R)

                  return canvas.resize((diameter, diameter), Image.LANCZOS)

              # 1. Android Adaptive Icon Foreground (1024x1024, circular medallion at 64% inside 66% Safe Zone)
              fg = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
              medallion_fg = make_circular_medallion(656, logo_ratio=0.76, ring_px=14)
              fg.paste(medallion_fg, ((1024 - 656) // 2, (1024 - 656) // 2), medallion_fg)
              fg.save("resources/icon-foreground.png")

              # 2. Android Adaptive Icon Background (solid matching deep royal navy)
              bg = Image.new("RGBA", (1024, 1024), navy_rgba)
              bg.save("resources/icon-background.png")

              # 3. Master Circular Icon (1024x1024 transparent corners with full padded circular medallion)
              master_circle = make_circular_medallion(1024, logo_ratio=0.76, ring_px=22)
              master_circle.save("resources/icon.png")

              # 4. Splash Screen (2732x2732 centered circular gold-ringed medallion on matching navy)
              splash = Image.new("RGBA", (2732, 2732), navy_rgba)
              medallion_sp = make_circular_medallion(820, logo_ratio=0.76, ring_px=18)
              splash.paste(medallion_sp, ((2732 - 820) // 2, (2732 - 820) // 2), medallion_sp)
              splash.save("resources/splash.png")
              print("Generated full circular uncropped Adaptive Icon & Splash assets successfully.")
          except Exception as e:
              print("Pillow fallback triggered:", e)
              shutil.copyfile("public/pwa-512x512.png", "resources/icon.png")
              shutil.copyfile("public/pwa-512x512.png", "resources/splash.png")
          PYEOF
          npx capacitor-assets generate --android --iconBackgroundColor '#061124' --splashBackgroundColor '#061124' || true

          # Guarantee crisp circular ic_launcher & ic_launcher_round across ALL Android mipmap densities (Android 6.0 - 15)
          python3 - <<'PYEOF'
          import os
          try:
              from PIL import Image
              circle_src = Image.open("resources/icon.png").convert("RGBA")
              densities = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              res_dir = "android/app/src/main/res"
              for folder, px in densities.items():
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  # Pad slightly (92% circle) so legacy launchers never clip the gold perimeter
                  canvas = Image.new("RGBA", (px, px), (0, 0, 0, 0))
                  inner = max(1, int(round(px * 0.92)))
                  resized = circle_src.resize((inner, inner), Image.LANCZOS)
                  off = (px - inner) // 2
                  canvas.paste(resized, (off, off), resized)
                  canvas.save(os.path.join(out_dir, "ic_launcher.png"))
                  canvas.save(os.path.join(out_dir, "ic_launcher_round.png"))
              print("Verified circular ic_launcher & ic_launcher_round across all mipmap densities.")
          except Exception as e:
              print("Mipmap post-process skipped:", e)
          PYEOF

          mkdir -p android/app/src/main/res/drawable
          cp resources/icon.png android/app/src/main/res/drawable/taibah_logo.png || cp public/pwa-512x512.png android/app/src/main/res/drawable/taibah_logo.png || true

      - name: Configure Android 6.0+ (minSdk 23), Auto-Increment VersionCode & Native Permissions
        run: |
          set -euo pipefail
          # 1. Enforce Android 6.0+ (API 23) minimum compatibility for @capacitor/filesystem (ionfilesystem-android:1.1.1) & Biometric Keystore
          VARS_GRADLE="android/variables.gradle"
          if [ -f "$VARS_GRADLE" ]; then
            sed -i -E 's/minSdkVersion\s*=\s*[0-9]+/minSdkVersion = 23/' "$VARS_GRADLE"
            echo "=== Verified android/variables.gradle ==="
            cat "$VARS_GRADLE"
          fi

          # 2. Ensure numeric minSdkVersion in android/app/build.gradle (if hardcoded) is also 23,
          #    and auto-increment versionCode & versionName while preserving applicationId "net.taibah.wireless"
          APP_GRADLE="android/app/build.gradle"
          sed -i -E 's/(minSdk(Version)?[[:space:]]*=?[[:space:]]*)[0-9]+/\123/' "$APP_GRADLE"
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="2.1.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/versionCode\s+[0-9]+/versionCode ${VERSION_CODE}/" "$APP_GRADLE"
          sed -i -E "s/versionName\s+\"[^\"]+\"/versionName \"${VERSION_NAME}\"/" "$APP_GRADLE"
          echo "=== Configured APK Version: versionCode=${VERSION_CODE}, versionName=${VERSION_NAME} ==="
          grep -E "applicationId|minSdk|versionCode|versionName" "$APP_GRADLE" || true
          echo "APK_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "APK_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

          # 3. Configure Required Native Permissions (Contacts, BiometricPrompt/Fingerprint & Notifications)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in \
            "android.permission.READ_CONTACTS" \
            "android.permission.WRITE_CONTACTS" \
            "android.permission.USE_BIOMETRIC" \
            "android.permission.USE_FINGERPRINT" \
            "android.permission.POST_NOTIFICATIONS"; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "0,/<application/{s|<application|<uses-permission android:name=\"$PERM\" />\n    <application|}" "$MANIFEST"
            fi
          done

          # 4. Enforce adjustResize + hardwareAccelerated="true" on application & MainActivity for 60fps smooth typing
          python3 - <<'PYEOF'
          import re
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              xml = f.read()

          def ensure_tag_attr(content: str, tag: str, attr: str, value: str) -> str:
              pattern = rf'(<{tag}\b[^>]*>)'
              def repl(m):
                  opening = m.group(1)
                  attr_re = rf'{re.escape(attr)}="[^"]*"'
                  if re.search(attr_re, opening):
                      return re.sub(attr_re, f'{attr}="{value}"', opening)
                  return opening.replace(f'<{tag}', f'<{tag}\n        {attr}="{value}"', 1)
              return re.sub(pattern, repl, content, count=1, flags=re.DOTALL)

          xml = ensure_tag_attr(xml, 'application', 'android:hardwareAccelerated', 'true')
          xml = ensure_tag_attr(xml, 'activity', 'android:hardwareAccelerated', 'true')
          xml = ensure_tag_attr(xml, 'activity', 'android:windowSoftInputMode', 'adjustResize')

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(xml)
          print("Verified hardwareAccelerated=true & windowSoftInputMode=adjustResize in AndroidManifest.xml")
          PYEOF

          # 5. Enable R8 Code Shrinking, Resource Shrinking, resConfigs ("ar", "en") & Custom ProGuard Rules (~8-11MB Release APK)
          if [ -f "proguard-rules.pro" ]; then
            cp -f "proguard-rules.pro" "android/app/proguard-rules.pro"
            echo "Copied custom proguard-rules.pro into android/app/proguard-rules.pro"
          fi

          python3 - <<'PYEOF'
          import re, textwrap
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              txt = f.read()

          # Inject GITHUB_REPO and APP_BUILD_NUMBER properties cleanly as BuildConfig fields (AGP 8+ requires buildFeatures.buildConfig = true)
          repo_props_block = textwrap.dedent("""\
              def taibahGithubRepo = (project.findProperty('GITHUB_REPO') ?: System.getenv('GITHUB_REPOSITORY') ?: '').toString().trim().replace('"', '')
              def taibahBuildNumRaw = (project.findProperty('APP_BUILD_NUMBER') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '0').toString().trim()
              def taibahBuildNum = taibahBuildNumRaw.isInteger() ? taibahBuildNumRaw.toInteger() : 0
          """)
          if 'taibahGithubRepo' not in txt:
              txt = re.sub(
                  r'(android\s*\{)',
                  lambda m: repo_props_block + '\n' + m.group(1),
                  txt,
                  count=1
              )

          if 'buildFeatures' not in txt:
              txt = re.sub(
                  r'(android\s*\{)',
                  lambda m: m.group(1) + '\n    buildFeatures {\n        buildConfig true\n    }',
                  txt,
                  count=1
              )
          elif 'buildConfig' not in txt:
              txt = re.sub(
                  r'(buildFeatures\s*\{)',
                  lambda m: m.group(1) + '\n        buildConfig true',
                  txt,
                  count=1
              )

          if 'buildConfigField "String", "GITHUB_REPO"' not in txt:
              bc_lines = (
                  '\n        buildConfigField "String", "GITHUB_REPO", "\\"${taibahGithubRepo}\\""'
                  '\n        buildConfigField "int", "APP_BUILD_NUMBER", "${taibahBuildNum}"'
              )
              txt = re.sub(
                  r'(defaultConfig\s*\{)',
                  lambda m: m.group(1) + bc_lines,
                  txt,
                  count=1
              )

          # Add resConfigs "ar", "en" inside defaultConfig to strip unused AndroidX/Play Services locales
          if 'resConfigs' not in txt and 'resourceConfigurations' not in txt:
              txt = re.sub(
                  r'(defaultConfig\s*\{)',
                  '\\1\n        resConfigs "ar", "en"',
                  txt,
                  count=1
              )

          # Enable minifyEnabled true & shrinkResources true in release buildType
          if re.search(r'minifyEnabled\s+false', txt):
              txt = re.sub(
                  r'minifyEnabled\s+false',
                  'minifyEnabled true\n            shrinkResources true',
                  txt,
                  count=1
              )
          elif 'shrinkResources' not in txt:
              txt = re.sub(
                  r'(release\s*\{)',
                  '\\1\n            minifyEnabled true\n            shrinkResources true',
                  txt,
                  count=1
              )

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(txt)
          print("Enabled BuildConfig (GITHUB_REPO + APP_BUILD_NUMBER), minifyEnabled, shrinkResources, and resConfigs ar/en in android/app/build.gradle")
          PYEOF

          echo "=== Verified AndroidManifest.xml permissions & keyboard mode ==="
          grep -E "uses-permission|windowSoftInputMode" "$MANIFEST" || true
          echo "=== Verified android/app/build.gradle BuildConfig, shrinking & resConfigs ==="
          grep -E "buildConfig|GITHUB_REPO|APP_BUILD_NUMBER|resConfigs|minifyEnabled|shrinkResources|proguardFiles" "$APP_GRADLE" || true

      - name: Restore Persistent Fallback Release Keystore (Seamless In-Place Upgrades)
        uses: actions/cache@v4
        with:
          path: .taibah-keystore
          key: taibah-net-persistent-signing-keystore-v1

      - name: Build & Sign Installable Android APK (Debug / Release V1+V2+V3)
        working-directory: android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          test -x "$APKSIGNER" || { echo "::error::apksigner not found in $BUILD_TOOLS_DIR"; exit 1; }
          test -x "$ZIPALIGN" || { echo "::error::zipalign not found in $BUILD_TOOLS_DIR"; exit 1; }

          rm -f ../TaibahNet-Cards.apk release.keystore

          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "=== Building Signed Android Debug APK ==="
            ./gradlew assembleDebug \
              -PGITHUB_REPO="${{ github.repository }}" \
              -PAPP_BUILD_NUMBER="${{ github.run_number }}"
            DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
            test -s "$DEBUG_APK" || { echo "::error::Debug APK not produced at $DEBUG_APK"; exit 1; }
            cp -f "$DEBUG_APK" ../TaibahNet-Cards.apk
            echo "SIGNING_STATUS=DEBUG_SIGNED" >> "$GITHUB_ENV"
          else
            echo "=== Building Signed Android Release APK ==="
            ./gradlew assembleRelease \
              -PGITHUB_REPO="${{ github.repository }}" \
              -PAPP_BUILD_NUMBER="${{ github.run_number }}"

            if [ -s "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              RAW_RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            elif [ -s "app/build/outputs/apk/release/app-release.apk" ]; then
              RAW_RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
            else
              echo "::error::Release APK output not found in app/build/outputs/apk/release/"
              ls -la app/build/outputs/apk/release/ || true
              exit 1
            fi

            ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
            rm -f "$ALIGNED_APK"
            "$ZIPALIGN" -f -p -v 4 "$RAW_RELEASE_APK" "$ALIGNED_APK"

            if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
              echo "Using repository Android Release Keystore secrets..."
              echo "$KEYSTORE_B64" | base64 -d > release.keystore
              SIGN_STORE_PASS="$KEYSTORE_PASS"
              SIGN_KEY_ALIAS="$KEY_ALIAS"
              SIGN_KEY_PASS="$KEY_PASS"
              echo "SIGNING_STATUS=RELEASE_SIGNED_ORIGINAL_KEYSTORE" >> "$GITHUB_ENV"
            else
              mkdir -p ../.taibah-keystore
              CACHED_KS="../.taibah-keystore/release.keystore"
              CACHED_META="../.taibah-keystore/meta.env"
              if [ -s "$CACHED_KS" ] && [ -s "$CACHED_META" ]; then
                echo "Reusing persistent cached RSA-2048 Release Keystore for seamless in-place updates..."
                # shellcheck disable=SC1090
                source "$CACHED_META"
                cp -f "$CACHED_KS" release.keystore
                echo "SIGNING_STATUS=RELEASE_SIGNED_PERSISTENT_KEYSTORE_V1_V2_V3" >> "$GITHUB_ENV"
              else
                echo "Initializing persistent RSA-2048 Release Keystore via keytool..."
                SIGN_STORE_PASS=$(openssl rand -hex 16)
                SIGN_KEY_PASS="$SIGN_STORE_PASS"
                SIGN_KEY_ALIAS="taibah-net-release"
                keytool -genkeypair -v \
                  -keystore release.keystore \
                  -storetype PKCS12 \
                  -alias "$SIGN_KEY_ALIAS" \
                  -keyalg RSA \
                  -keysize 2048 \
                  -validity 10000 \
                  -storepass "$SIGN_STORE_PASS" \
                  -keypass "$SIGN_KEY_PASS" \
                  -dname "CN=Taibah Net, OU=TAIBAH NET, O=Taibah Net Wireless, L=Yemen, C=YE"
                cp -f release.keystore "$CACHED_KS"
                printf 'SIGN_STORE_PASS=%q\nSIGN_KEY_PASS=%q\nSIGN_KEY_ALIAS=%q\n' \
                  "$SIGN_STORE_PASS" "$SIGN_KEY_PASS" "$SIGN_KEY_ALIAS" > "$CACHED_META"
                chmod 600 "$CACHED_KS" "$CACHED_META"
                echo "SIGNING_STATUS=RELEASE_SIGNED_PERSISTENT_KEYSTORE_INITIALIZED" >> "$GITHUB_ENV"
              fi
            fi

            "$APKSIGNER" sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks release.keystore \
              --ks-pass "pass:$SIGN_STORE_PASS" \
              --ks-key-alias "$SIGN_KEY_ALIAS" \
              --key-pass "pass:$SIGN_KEY_PASS" \
              --out ../TaibahNet-Cards.apk \
              "$ALIGNED_APK"

            rm -f release.keystore "$ALIGNED_APK"
          fi

          test -s ../TaibahNet-Cards.apk || { echo "::error::Final TaibahNet-Cards.apk is missing or empty"; exit 1; }

          echo "=== Verifying APK Alignment (zipalign -c) ==="
          "$ZIPALIGN" -c -v 4 ../TaibahNet-Cards.apk

          echo "=== Verifying Official APK Signature (apksigner verify) ==="
          "$APKSIGNER" verify --verbose --print-certs ../TaibahNet-Cards.apk

          if [ -x "$AAPT2" ]; then
            echo "=== Verifying Android Package Metadata (aapt2) ==="
            "$AAPT2" dump badging ../TaibahNet-Cards.apk | head -n 5
          fi

          echo "=== APK SHA-256 & File Size ==="
          sha256sum ../TaibahNet-Cards.apk
          ls -lh ../TaibahNet-Cards.apk

      - name: Upload TaibahNet-Cards.apk Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaibahNet-Cards-APK
          path: TaibahNet-Cards.apk
          retention-days: 90

      - name: Compose Final Release Body from release-notes.json
        run: |
          cat <<'EOF' > .github-release-final.md
          الإصدار النهائي الجاهز للتثبيت والتحديث المباشر أو التحديث الخفيف (OTA) لتطبيق **كروت طيبة نت – TAIBAH NET**.
          - **applicationId:** `net.taibah.wireless`
          - **الإصدار:** `${{ env.APK_VERSION_NAME }}` (`versionCode: ${{ env.APK_VERSION_CODE }}`)
          - **التوافق:** Android 6.0+ (`minSdkVersion = 23`)
          - **حالة التوقيع:** `${{ env.SIGNING_STATUS }}`

          EOF
          if [ -f ".release-notes-body.md" ]; then
            cat .release-notes-body.md >> .github-release-final.md
          fi

      - name: Publish Direct APK & Lightweight OTA Bundle to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: كروت طيبة نت — TAIBAH NET (Android Release APK + OTA)
          draft: false
          prerelease: false
          make_latest: true
          body_path: .github-release-final.md
          files: |
            version.json
            update.zip
            TaibahNet-Cards.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
